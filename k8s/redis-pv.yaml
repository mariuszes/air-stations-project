apiVersion: v1
kind: PersistentVolume

metadata:
  name: redis-pv

spec:
  capacity:
    storage: 1Gi
  
  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  local:
    path: /mnt/redis-data

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - air-stations-multi-worker
